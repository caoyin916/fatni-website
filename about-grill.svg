<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-label="Charcoal grill at Fat Ni BBQ with skewers over glowing coals">
  <defs>
    <!-- Coal glow radial -->
    <radialGradient id="coalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF6B1A" stop-opacity="0.95"/>
      <stop offset="40%"  stop-color="#D94010" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#3A1A08" stop-opacity="0"/>
    </radialGradient>
    <!-- Individual coal pieces -->
    <radialGradient id="coal1" cx="40%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#FF8C3A"/>
      <stop offset="60%" stop-color="#C03010"/>
      <stop offset="100%" stop-color="#2A1005"/>
    </radialGradient>
    <radialGradient id="coal2" cx="55%" cy="35%" r="60%">
      <stop offset="0%"  stop-color="#FF7020"/>
      <stop offset="55%" stop-color="#B02808"/>
      <stop offset="100%" stop-color="#1E0C02"/>
    </radialGradient>
    <!-- Meat gradient -->
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#C8500A"/>
      <stop offset="50%"  stop-color="#8B2E06"/>
      <stop offset="100%" stop-color="#5C1E04"/>
    </linearGradient>
    <!-- Skewer metal -->
    <linearGradient id="skewer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D4B896"/>
      <stop offset="50%"  stop-color="#A08060"/>
      <stop offset="100%" stop-color="#7A5C3C"/>
    </linearGradient>
    <!-- Smoke -->
    <filter id="smokeBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <!-- Grill grate shadow -->
    <linearGradient id="grateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4A3020"/>
      <stop offset="100%" stop-color="#1E0E06"/>
    </linearGradient>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1A0E08"/>
      <stop offset="100%" stop-color="#0D0704"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="460" fill="url(#bgGrad)"/>

  <!-- Ambient ember glow from coals -->
  <ellipse cx="300" cy="320" rx="220" ry="80" fill="url(#coalGlow)" opacity="0.55"/>

  <!-- ====== GRILL BODY ====== -->
  <!-- Main grill basin (trapezoidal) -->
  <path d="M100 260 L500 260 L470 360 L130 360 Z" fill="#2A1A0C" stroke="#4A2E14" stroke-width="2"/>

  <!-- Coal bed inside grill -->
  <path d="M130 285 L470 285 L455 355 L145 355 Z" fill="#1A0A04"/>

  <!-- Glowing coal chunks -->
  <ellipse cx="190" cy="330" rx="28" ry="16" fill="url(#coal1)" opacity="0.9"/>
  <ellipse cx="240" cy="315" rx="22" ry="13" fill="url(#coal2)" opacity="0.85"/>
  <ellipse cx="290" cy="335" rx="30" ry="17" fill="url(#coal1)" opacity="0.95"/>
  <ellipse cx="345" cy="318" rx="24" ry="14" fill="url(#coal2)" opacity="0.88"/>
  <ellipse cx="395" cy="330" rx="26" ry="15" fill="url(#coal1)" opacity="0.90"/>
  <ellipse cx="435" cy="315" rx="20" ry="12" fill="url(#coal2)" opacity="0.82"/>
  <ellipse cx="160" cy="345" rx="18" ry="10" fill="url(#coal1)" opacity="0.75"/>
  <ellipse cx="320" cy="348" rx="22" ry="11" fill="url(#coal2)" opacity="0.80"/>
  <ellipse cx="460" cy="342" rx="16" ry="9"  fill="url(#coal1)" opacity="0.70"/>

  <!-- Coal hot-glow highlight layer -->
  <ellipse cx="300" cy="328" rx="170" ry="35" fill="#FF5010" opacity="0.12"/>

  <!-- Grill rim (top edge of basin) -->
  <rect x="95" y="254" width="410" height="12" rx="4" fill="#3A2010" stroke="#5A3A18" stroke-width="1.5"/>

  <!-- Grill legs -->
  <rect x="148" y="358" width="14" height="72" rx="5" fill="#2E1A0A"/>
  <rect x="438" y="358" width="14" height="72" rx="5" fill="#2E1A0A"/>
  <!-- Leg cross-brace -->
  <line x1="155" y1="400" x2="445" y2="400" stroke="#2E1A0A" stroke-width="8" stroke-linecap="round"/>

  <!-- ====== GRILL GRATES ====== -->
  <!-- Horizontal bars -->
  <g stroke="#5A3A1A" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="108" y1="268" x2="492" y2="268"/>
    <line x1="110" y1="280" x2="490" y2="280"/>
  </g>
  <!-- Vertical bars -->
  <g stroke="#4A2E12" stroke-width="3.5" stroke-linecap="round" opacity="0.70">
    <line x1="140" y1="260" x2="140" y2="285"/>
    <line x1="180" y1="260" x2="180" y2="285"/>
    <line x1="220" y1="260" x2="220" y2="285"/>
    <line x1="260" y1="260" x2="260" y2="285"/>
    <line x1="300" y1="260" x2="300" y2="285"/>
    <line x1="340" y1="260" x2="340" y2="285"/>
    <line x1="380" y1="260" x2="380" y2="285"/>
    <line x1="420" y1="260" x2="420" y2="285"/>
    <line x1="460" y1="260" x2="460" y2="285"/>
  </g>

  <!-- ====== SKEWERS ====== -->
  <!-- Skewer 1 -->
  <line x1="72" y1="220" x2="528" y2="220" stroke="url(#skewer)" stroke-width="4" stroke-linecap="round"/>
  <!-- Meat chunks on skewer 1 -->
  <ellipse cx="170" cy="218" rx="20" ry="13" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="220" cy="216" rx="22" ry="14" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="272" cy="219" rx="20" ry="13" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="324" cy="217" rx="21" ry="14" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="376" cy="219" rx="20" ry="13" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="426" cy="216" rx="22" ry="14" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>

  <!-- Skewer 2 -->
  <line x1="72" y1="240" x2="528" y2="240" stroke="url(#skewer)" stroke-width="4" stroke-linecap="round"/>
  <!-- Meat chunks on skewer 2 -->
  <ellipse cx="155" cy="238" rx="19" ry="12" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="206" cy="237" rx="21" ry="13" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="258" cy="239" rx="20" ry="12" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="310" cy="237" rx="22" ry="14" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="362" cy="239" rx="20" ry="12" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>
  <ellipse cx="414" cy="237" rx="21" ry="13" fill="url(#meatGrad)" stroke="#7A3010" stroke-width="1"/>

  <!-- Skewer 3 (back, smaller) -->
  <line x1="72" y1="202" x2="528" y2="202" stroke="url(#skewer)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="185" cy="201" rx="17" ry="11" fill="url(#meatGrad)" stroke="#6A2808" stroke-width="1" opacity="0.8"/>
  <ellipse cx="244" cy="200" rx="19" ry="12" fill="url(#meatGrad)" stroke="#6A2808" stroke-width="1" opacity="0.8"/>
  <ellipse cx="303" cy="201" rx="17" ry="11" fill="url(#meatGrad)" stroke="#6A2808" stroke-width="1" opacity="0.8"/>
  <ellipse cx="362" cy="200" rx="19" ry="12" fill="url(#meatGrad)" stroke="#6A2808" stroke-width="1" opacity="0.8"/>
  <ellipse cx="420" cy="201" rx="17" ry="11" fill="url(#meatGrad)" stroke="#6A2808" stroke-width="1" opacity="0.8"/>

  <!-- ====== CHAR / SEAR MARKS on top skewer row ====== -->
  <g fill="#1A0800" opacity="0.45">
    <ellipse cx="220" cy="215" rx="8" ry="5"/>
    <ellipse cx="324" cy="216" rx="7" ry="4"/>
    <ellipse cx="426" cy="215" rx="8" ry="5"/>
    <ellipse cx="170" cy="218" rx="6" ry="4"/>
  </g>

  <!-- ====== SMOKE WISPS ====== -->
  <g fill="#C8A080" opacity="0.08" filter="url(#smokeBlur)">
    <ellipse cx="200" cy="155" rx="18" ry="45"/>
    <ellipse cx="210" cy="120" rx="14" ry="35"/>
    <ellipse cx="300" cy="145" rx="20" ry="50"/>
    <ellipse cx="308" cy="105" rx="15" ry="38"/>
    <ellipse cx="400" cy="150" rx="18" ry="45"/>
    <ellipse cx="392" cy="115" rx="13" ry="30"/>
  </g>

  <!-- ====== EMBER SPARKS ====== -->
  <g fill="#FF8C3A">
    <circle cx="210" cy="260" r="1.8" opacity="0.9"/>
    <circle cx="330" cy="258" r="1.4" opacity="0.85"/>
    <circle cx="275" cy="255" r="1.0" opacity="0.7"/>
    <circle cx="390" cy="262" r="1.6" opacity="0.8"/>
    <circle cx="165" cy="257" r="1.2" opacity="0.75"/>
    <circle cx="450" cy="259" r="1.0" opacity="0.65"/>
  </g>

  <!-- Subtle orange light wash on grate from coals below -->
  <rect x="95" y="254" width="410" height="32" fill="#FF4400" opacity="0.07" rx="2"/>

</svg>
